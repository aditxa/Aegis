[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-signal-x"
version = "0.4.0"
description = "Multi-source financial early-risk intelligence with NLP, tail, market microstructure, graph contagion, tactical rebalancing and stress testing"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "requests>=2.31",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "networkx>=3.2",
  "beautifulsoup4>=4.12"
]

[tool.setuptools.packages.find]
include = ["aegis*"]
